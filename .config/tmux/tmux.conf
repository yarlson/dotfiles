set -g default-terminal "tmux-256color"
set -s 'terminal-overrides[100]' 'xterm-256color:RGB'
set -g allow-passthrough on
set -s extended-keys on
set -s 'terminal-features[0]' 'xterm-ghostty:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:osc7:RGB:sync:title:usstyle'
set -s 'terminal-features[100]' 'xterm*:clipboard:ccolour:cstyle:focus:title'

setw -g mouse on

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
setw -g aggressive-resize on
set -g status-keys emacs

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'yarlson/tmux-last-url'

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key a last-window
bind-key C-p previous-window
bind-key C-n next-window
bind-key '[' previous-window
bind-key ']' next-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key R source-file "~/.config/tmux/tmux.conf" \; display-message "Sourced ~/.config/tmux/tmux.conf"
bind-key S display-popup -EE -w 44 -h 5 -T " New session " 'printf "Name: "; IFS= read -r name; if [ -z "$name" ]; then printf "\nName is required.\n"; exit 1; fi; tmux new-session -d -s "$name" && tmux switch-client -t "$name"'

bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

set -g @agent "#{?#{==:#{pane_current_command},codex},codex,#{?#{||:#{==:#{pane_current_command},claude},#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}},claude,}}"

bind-key -T prefix N rename-window "#{?#{E:@agent},#{E:@agent} - ,}#{b:pane_current_path}"

bind-key 0 if-shell "true" "select-window -t :0" \; refresh-client -S
bind-key 1 if-shell "true" "select-window -t :1" \; refresh-client -S
bind-key 2 if-shell "true" "select-window -t :2" \; refresh-client -S
bind-key 3 if-shell "true" "select-window -t :3" \; refresh-client -S
bind-key 4 if-shell "true" "select-window -t :4" \; refresh-client -S
bind-key 5 if-shell "true" "select-window -t :5" \; refresh-client -S
bind-key 6 if-shell "true" "select-window -t :6" \; refresh-client -S
bind-key 7 if-shell "true" "select-window -t :7" \; refresh-client -S
bind-key 8 if-shell "true" "select-window -t :8" \; refresh-client -S
bind-key 9 if-shell "true" "select-window -t :9" \; refresh-client -S

bind-key -T prefix          r                 switch-client -T resize-pane
bind-key -r -T resize-pane  Up                resize-pane -U 5
bind-key -r -T resize-pane  Down              resize-pane -D 5
bind-key -r -T resize-pane  Left              resize-pane -L 5
bind-key -r -T resize-pane  Right             resize-pane -R 5
bind-key -r -T resize-pane  k                 resize-pane -U 5
bind-key -r -T resize-pane  j                 resize-pane -D 5
bind-key -r -T resize-pane  h                 resize-pane -L 5
bind-key -r -T resize-pane  l                 resize-pane -R 5

set -g status-position top
set -g base-index 1
set -g pane-base-index 1

# Colors from the Fleet theme that Neovim uses (felipeagc/fleet-theme-nvim)
# Note: Color hexes in lower case to avoid tmux flag confusion

fleet_background="#181818"
fleet_darker="#292929"
fleet_dark_gray="#535353"
fleet_dark="#898989"
fleet_light="#d6d6dd"
fleet_blue="#52a7f6"
fleet_selection="#1f3661"

# status
set -g status "on"
set -g status-bg $fleet_background
set -g status-justify "left"
set -g status-left-length "32"
set -g status-right-length "42"
set -g status-interval "30"

# messages
set -g message-style "fg=$fleet_light,bg=$fleet_background,align=centre"
set -g message-command-style "fg=$fleet_light,bg=$fleet_darker,align=centre"

# panes
set -g pane-border-style fg=$fleet_dark_gray
set -g pane-active-border-style fg=$fleet_dark_gray
setw -g window-style fg=terminal,bg=terminal
setw -g window-active-style fg=$fleet_light,bg=$fleet_background

# windows
setw -g window-status-separator " "
setw -g window-status-style fg=$fleet_light,bg=$fleet_dark_gray
setw -g window-status-current-style fg=$fleet_background,bg=$fleet_blue,bold

# statusline
set -g status-left "#[bg=#$fleet_darker,fg=#$fleet_blue,bold] #S #[bg=#$fleet_background,fg=#$fleet_dark,nobold] "
set -g status-right "#(~/.config/tmux/status-right.sh)"

# Modes
setw -g clock-mode-colour $fleet_blue
setw -g mode-style fg=$fleet_light,bg=$fleet_selection

run '~/.tmux/plugins/tpm/tpm'

# window-status
setw -g window-status-format " #I  #W "
setw -g window-status-current-format " #I  #W "
setw -g automatic-rename off
